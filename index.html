<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight Play</title>

    <style>

         @font-face{
            font-family:'pervitina';
            src: url(./fonts/Pervitina.ttf);
         }
        

        body{
            margin: 0;
            font-family:'pervitina';
            background-color: #641b1b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login{
            background-color: #1e1e1e;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px #ca0606;
            text-align: center;
        }


        h1{color: #cf1d1d}
           

        p{color: white;}

        input{
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button{
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #d42626;
            font-weight: bold;
            cursor: pointer;
            font-size: 20px;
        }
        
        button:hover{
            background: #ff0000;
        }

        a{
            text-decoration: none;
            color: #c82a2a;
        }


    </style>

</head>


<body>
     <div class="login">

         <h1>FIGHTPLAY🥷🏻</h1>

         <p>Entre na sua conta</p>

         <form action="home.html">

            <input type="email" placeholder="Digite seu e-mail">

            <input type="password" placeholder="Digite seu senha">

            <button type="submit"> Entrar </button>

         </form>

         <p>  
            <a href="#"> Criar Conta</a>
         </p>

     </div>


</body>
</html>
